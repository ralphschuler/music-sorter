name: Build and smoke test

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore MusicSorter.slnx
      - run: dotnet build MusicSorter.slnx -c Release --no-restore
      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/MusicSorter.Smoke -c Release --no-build
      - name: Run smoke tests (macOS)
        if: runner.os == 'macOS'
        env:
          TMPDIR: /private/tmp
        run: dotnet run --project tests/MusicSorter.Smoke -c Release --no-build
