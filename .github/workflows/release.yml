name: Publish release archives

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  package:
    name: Package ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            archive: music-sorter-windows-x64.zip
          - os: macos-15
            rid: osx-arm64
            archive: music-sorter-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Require a version tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] ||
            { echo 'Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease.' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet restore MusicSorter.slnx
      - run: dotnet build MusicSorter.slnx -c Release --no-restore
      - name: Run smoke tests (Windows)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/MusicSorter.Smoke -c Release --no-build
      - name: Run smoke tests (macOS)
        if: runner.os == 'macOS'
        env:
          TMPDIR: /private/tmp
        run: dotnet run --project tests/MusicSorter.Smoke -c Release --no-build
      - name: Publish self-contained desktop
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: dotnet publish src/MusicSorter.Desktop -c Release -r "$RID" --self-contained true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Assemble Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path artifacts/publish/MusicSorter.exe -PathType Leaf)) { throw 'Missing Windows executable.' }
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path artifacts/publish).Path,
            (Join-Path (Resolve-Path artifacts).Path $env:ARCHIVE))
      - name: Assemble unsigned macOS app ZIP
        if: runner.os == 'macOS'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          bundle='artifacts/Music Sorter.app'
          mkdir -p "$bundle/Contents/MacOS"
          cp -R artifacts/publish/. "$bundle/Contents/MacOS/"
          test -x "$bundle/Contents/MacOS/MusicSorter"
          test "$(lipo -archs "$bundle/Contents/MacOS/MusicSorter")" = arm64
          cat >"$bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>app.music-sorter.desktop</string>
            <key>CFBundleName</key><string>Music Sorter</string>
            <key>CFBundleExecutable</key><string>MusicSorter</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $version" "$bundle/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $version" "$bundle/Contents/Info.plist"
          plutil -lint "$bundle/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "artifacts/$ARCHIVE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify archives and calculate SHA-256
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          unzip -tq music-sorter-windows-x64.zip
          unzip -tq music-sorter-macos-arm64.zip
          sha256sum music-sorter-windows-x64.zip music-sorter-macos-arm64.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/music-sorter-release-notes.md"
          cat >"$notes" <<'NOTES'
          ## Downloads
          - Windows x64: extract the ZIP and open `MusicSorter.exe`.
          - macOS Apple Silicon: extract the ZIP to get `Music Sorter.app`.
          - `SHA256SUMS.txt` contains the expected hashes for the two archives.

          These are self-contained builds, not installers. Windows is unsigned; the macOS build has no Developer ID signing or notarization. OS trust prompts can apply. Do not bypass security warnings for an unverified download.

          Chromaprint (`fpcalc`) is optional and is not bundled. Normal sorting uses local tags and original-file hashes without it.
          NOTES
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/music-sorter-windows-x64.zip dist/music-sorter-macos-arm64.zip dist/SHA256SUMS.txt --repo "$GH_REPO" --verify-tag --title "Music Sorter $GITHUB_REF_NAME" --notes-file "$notes" "${flags[@]}"
